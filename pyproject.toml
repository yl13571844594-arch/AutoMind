[build-system]
# >=77：PEP 639 的 license / license-files（SPDX 表达式 + 许可文件随包）自该版起支持；
# 沿用旧的 >=75 会让干净环境里的构建在解析 license-files 时直接失败。
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automind-agent"
# 与 automind/__init__.py 的 __version__ 保持一致（§14.1 单一数据源）
version = "1.6.3"
description = "通用自动化 Agent 框架（社区版）- 支持分层规划、符号推理、自我纠错、MCP 和多模型后端"
readme = "README.md"
license = "MIT"
# 让 LICENSE 正文随包分发（PyPI 上 1.1.0 的 License 字段为空即因缺此项）
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "AutoMind Team"}]
keywords = ["agent", "automation", "llm", "mcp", "planning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",  # §14.3：CLI Rich REPL（提升为核心依赖）
]

[project.urls]
# 此前指向 github.com/automind/automind —— 该仓库不存在（实测 404），
# PyPI 项目页上的主页/仓库/Issues 三个链接因此全是死链。改为真实仓库。
Homepage = "https://github.com/yl13571844594-arch/AutoMind"
Repository = "https://github.com/yl13571844594-arch/AutoMind"
Issues = "https://github.com/yl13571844594-arch/AutoMind/issues"
Changelog = "https://github.com/yl13571844594-arch/AutoMind/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
]
# 办公自动化工具（excel/word/pdf/calendar）。这些库不进核心依赖 ——
# 只用对话功能的用户没道理被拖上一堆 Office 解析库；工具照常注册，
# 缺库时返回可照抄的安装命令（见 automind/tools/_toolkit.py）。
#
# 这一组必须与 automind/tools/_toolkit.py 的 OPTIONAL_DEPS 保持同步 ——
# 缺库时工具返回的提示就是"pip install 'automind-agent[office]'"，
# 少一个包，那句提示就是一张空头支票（照做了还是用不了）。
# tests/tools/test_optional_deps.py 会断言两边一致。
office = [
    "openpyxl>=3.1",         # Excel 读写
    "python-docx>=1.1",      # Word 读写
    "pypdf>=4.0",            # PDF 解析与合并
    "icalendar>=5.0",        # ICS 日历
    "httpx>=0.27.0",         # web_search / http_request / im_integration
    # v1.6.0 内置多媒体 / 系统工具
    "pillow>=10.0",          # 图像处理 / 截屏 / 图表导出
    "python-pptx>=0.6.21",   # PowerPoint 生成
    "matplotlib>=3.7",       # 数据图表绘制
    "psutil>=5.9",           # 进程与端口管理
    "pyperclip>=1.8",        # 剪贴板读写
    "pytesseract>=0.3.10",   # OCR 文字识别（另需系统安装 Tesseract 引擎）
    "mutagen>=1.47",         # 音频元信息解析
]
full = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "rich>=13.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "icalendar>=5.0",
    "pillow>=10.0",
    "python-pptx>=0.6.21",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "pyperclip>=1.8",
    "pytesseract>=0.3.10",
    "mutagen>=1.47",
]
dev = [
    "automind-agent[web]",   # 测试需 Web 栈（fastapi/uvicorn/httpx/openai）
    "pypdf>=4.0",            # RAG 知识库 PDF 解析测试
    # 办公工具的依赖也进 dev：否则 CI 上 excel/word/calendar 的往返用例
    # 只会走"缺库时给安装提示"那条分支，真正的读写逻辑一行都没被跑到。
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "icalendar>=5.0",
    # v1.6.0 多媒体/系统工具同理 —— 不装的话 chart/ppt/image/process/clipboard
    # 的用例只能验"缺库提示"，真正的绘图与读写分支一行都跑不到。
    # 唯独 pytesseract 不进 dev：它还需要系统级 Tesseract 引擎，
    # CI 上装了 Python 包也只会换一种失败方式，反而掩盖真实结论。
    "pillow>=10.0",
    "python-pptx>=0.6.21",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "pyperclip>=1.8",
    "mutagen>=1.47",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]
# 桌面版打包（Windows/macOS/Linux 通用；平台窗口/托盘后端见下）
#   pywebview 后端：Windows=WebView2 内置，macOS=pyobjc（随 pywebview 装），
#   Linux=WebKit2GTK（需系统包 gir1.2-webkit2-4.1 + PyGObject，CI 里 apt 安装）。
desktop = [
    "automind-agent[web]",
    "pyinstaller>=6.3",
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
automind = "automind.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
# 显式排除商业包（automind_pro 位于 pro/ 目录，另行打包分发）
include = ["automind", "automind.*"]

# Web 工作台静态资源必须随包分发，否则 pip 安装后界面退化为兜底页
# v1.0：dist/ 为 React 前端构建产物（web/ 目录 pnpm build 生成），优先伺服
[tool.setuptools.package-data]
automind = [
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/dist/*.html",
    "static/dist/assets/*",
    # 内置插件（非 Python 包，需显式随包分发 plugin.json + hooks.py）
    "builtin_plugins/*/plugin.json",
    "builtin_plugins/*/hooks.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "ARG002",  # unused method arguments (common in overrides)
    "PTH123",  # open() vs Path.open() — both acceptable
    # ── 存量风格豁免（开源基线；不改变行为，后续版本渐进收紧）──
    "E501",    # 少量超长行（中文注释/长 URL）
    "E402",    # agent.py 等处的有意延迟导入布局
    "SIM105",  # 有意的 try/except-pass（回调/推送兜底）
    "SIM102", "SIM108", "SIM110", "SIM212",  # if 结构风格
    "ARG001", "ARG004",  # 回调/协议签名中未使用的参数
    "UP042",   # str-枚举基类改造涉及序列化行为，暂不动
    "B905",    # zip(strict=) — 既有调用点行为已验证
    "B007",    # 未使用的循环变量（计数循环）
    "F841",    # 局部变量赋值未用（调试/文档性赋值）
    "N806", "N814", "N818",  # 既有命名（含公开异常名，改名破坏 API）
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/", "venv/"]
